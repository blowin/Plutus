name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*' # Triggers the workflow only when a version tag (e.g., v1.0.0) is pushed

jobs:
  build:
    name: Build Artifacts
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - rid: win-x64
            os: windows
            output_name: plutus-windows-x64.exe
          - rid: linux-x64
            os: linux
            output_name: plutus-linux-x64
          - rid: osx-x64
            os: macos
            output_name: plutus-macos-x64

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' # Target .NET 10.0 SDK environment

    - name: Restore dependencies
      run: dotnet restore Plutus.sln

    - name: Check code formatting
      run: dotnet format Plutus.sln --verify-no-changes --no-restore

    - name: Publish for ${{ matrix.rid }}
      run: |
        dotnet publish Plutus.CLI/Plutus.CLI.csproj \
          -c Release \
          -r ${{ matrix.rid }} \
          --self-contained true \
          -p:PublishSingleFile=true \
          -p:PublishTrimmed=false \
          -o ./dist/${{ matrix.rid }}

    - name: Rename binary assets
      run: |
        cd ./dist/${{ matrix.rid }}
        if [ "${{ matrix.os }}" = "windows" ]; then
          mv Plutus.CLI.exe ${{ matrix.output_name }}
        else
          mv Plutus.CLI ${{ matrix.output_name }}
        fi

    - name: Upload temporary artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.output_name }}
        path: ./dist/${{ matrix.rid }}/${{ matrix.output_name }}

  publish:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required permission to create releases and upload assets

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download all built artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts
        merge-multiple: true

    - name: Generate and publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ./artifacts/plutus-windows-x64.exe
          ./artifacts/plutus-linux-x64
          ./artifacts/plutus-macos-x64
        draft: false
        prerelease: false
        generate_release_notes: true # Automatically generates release notes based on commit history

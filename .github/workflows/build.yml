name: Build & Code Quality Validation

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  validate:
    name: Validate Code and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x' # Target .NET 10.0 SDK environment

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages

          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.sln') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore Plutus.sln

      - name: Check code formatting
        run: dotnet format Plutus.sln --verify-no-changes --no-restore

      - name: Build solution (Debug mode)
        run: dotnet build Plutus.sln -c Debug --no-restore

      - name: Run unit tests
        run: dotnet test Plutus.sln -c Debug --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/test-results.trx"

        if: always()
